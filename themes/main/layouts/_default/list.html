{{ define "main" }}
{{/* Section/taxonomy list — full implementation in Milestone 6 */}}
<div style="max-width: var(--content-width); margin: var(--space-16) auto; padding: 0 var(--space-6);">
  <h1 style="font-family: var(--font-heading); font-size: var(--text-4xl); letter-spacing: var(--tracking-tight); margin-bottom: var(--space-8); padding-bottom: var(--space-4); border-bottom: 1px solid var(--color-border);">
    {{ .Title }}
  </h1>
  {{ range .Pages }}
  <article style="padding: var(--space-6) 0; border-bottom: 1px solid var(--color-border-subtle);">
    <h2 style="font-family: var(--font-heading); font-size: var(--text-2xl); margin-bottom: var(--space-2);">
      <a href="{{ .RelPermalink }}" style="text-decoration: none; color: var(--color-text-primary);">{{ .Title }}</a>
    </h2>
    <p style="font-size: var(--text-sm); color: var(--color-text-muted); margin-bottom: var(--space-3);">
      {{ .Date.Format "January 2, 2006" }}
      {{- with .ReadingTime }} · {{ . }} min read{{- end }}
    </p>
    <p style="color: var(--color-text-secondary); line-height: var(--leading-relaxed);">{{ .Summary }}</p>
  </article>
  {{ end }}
</div>
{{ end }}
